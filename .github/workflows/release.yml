name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # actionlint (pinned in actions.yml) doesn't parse the $/ self-repository syntax yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # check out the repository

  build:
    name: Build and test the artifact
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository

    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          extensions: curl, gd, json, mysqli, simplexml, zip
          tools: composer:2.11.2

      # bin/build-release also fails unless the version matches Plugin::VERSION
      # and the Version: header in vector-mu.php.
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bin/build-release "$VERSION" dist

      - name: Test the artifact in WordPress
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VECTOR_MU_TEST_DB_HOST: 127.0.0.1
          VECTOR_MU_TEST_DB_PASSWORD: root
        run: tests/integration/wordpress.sh "dist/vector-mu-$VERSION.tar.gz"

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vector-mu-${{ steps.version.outputs.version }}
          path: |
            dist/vector-mu-${{ steps.version.outputs.version }}.tar.gz
            dist/vector-mu-${{ steps.version.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vector-mu-${{ needs.build.outputs.version }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: dist
        run: |
          sha256sum --check --strict "vector-mu-$VERSION.tar.gz.sha256"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "vector-mu-$VERSION.tar.gz" \
            "vector-mu-$VERSION.tar.gz.sha256"
